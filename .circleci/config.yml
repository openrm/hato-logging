version: 2.1

orbs:
  qlty: qltysh/qlty-orb@0.0.10

rabbitmq: &rabbitmq
  image: rabbitmq:3-alpine

restore: &restore
  restore_cache:
    key: deps-{{ checksum "package-lock.json" }}

cache: &cache
  save_cache:
    key: deps-{{ checksum "package-lock.json" }}
    paths:
      - node_modules/

make: &make
  run:
    name: Install GNU Make
    command: apk add make --no-cache

wait: &wait
  run:
    name: Wait For RabbitMQ To Start
    command: until nc -z 127.0.0.1 5672; do sleep 1; done

test: &test
  steps:
    - checkout
    - *restore
    - *make
    - run:
        name: Install Dependencies
        command: make deps
    - *cache
    - *wait
    - run:
        name: Run Tests
        command: make types test

jobs:
  lint:
    docker:
      - image: node:14-alpine
    steps:
      - checkout
      - run:
          name: Install ESLint
          command: npm install --no-save eslint
      - *make
      - run:
          name: Run ESLint
          command: make lint

  node16:
    docker:
      - image: node:16-alpine
      - *rabbitmq
    <<: *test

  node18:
    docker:
      - image: node:18-alpine
      - *rabbitmq
    <<: *test

  coverage:
    docker:
      - image: node:14-alpine
      - *rabbitmq
    steps:
      - checkout
      - *restore
      - *make
      - run:
          name: Install Dependencies
          command: make deps
      - *cache
      - *wait
      - run:
          name: Run Tests & Calculate Coverage
          command: make coverage

      - persist_to_workspace:
          root: coverage
          paths:
            - lcov.info

  report_coverage:
    docker:
      - image: cimg/node:24.4
    steps:
      - checkout
      - attach_workspace:
          at: coverage
      - qlty/coverage_publish:
          files: coverage/lcov.info

workflows:
  version: 2
  build:
    jobs:
      - lint
      - node16:
          requires:
            - lint
      - node18:
          requires:
            - lint
      - coverage:
          requires:
            - lint
      - report_coverage:
          context: qlty
          requires:
            - coverage
